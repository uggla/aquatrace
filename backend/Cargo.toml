[package]
name = "aquatrace-backend"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
flate2 = "1.1.9"
gpx = "0.10.0"
osmpbf = "0.3.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rstar = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-bundled", "chrono", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
